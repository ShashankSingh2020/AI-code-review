name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx alembic psycopg2-binary asyncpg

    - name: Lint with Ruff
      run: |
        ruff check app/

    - name: Run Test Suite
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        SYNC_DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_db
        GEMINI_API_KEY: "mock_ci_test_key"
        TEMP_STORAGE_PATH: "/tmp/storage"
        PROJECT_NAME: "AI Code Review Engine"
      run: |
        python -m pytest -v
